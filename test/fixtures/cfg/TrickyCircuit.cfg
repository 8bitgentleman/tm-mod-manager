## Settings file was created by plugin Tricky Circuit v1.6.2
## Plugin GUID: TrickyCircuit

[Atmosphere]

Enabled = true

Snow = true

SnowAmount = 1

Mist = true

Drifts = true

Floor = Mixed

Brownout = true

DeadBars = 3,13

FlickerBars = 8

[Background]

## Overlay custom artwork on the Single Event and Circuit menu walls.
# Setting type: Boolean
# Default value: true
Enabled = true

## PNG (1024x1024, 1:1) overlaid on the Single Event wall (CenterScreen). Relative paths resolve next to this plugin DLL. Blank to leave that wall stock.
# Setting type: String
# Default value: bg_single_race.png
SingleEventImage = bg_single_race.png

## PNG (1024x1024, 1:1) overlaid on the Circuit wall (the repurposed button's wall). Relative paths resolve next to this plugin DLL. Blank to leave that wall stock.
# Setting type: String
# Default value: bg_circuit_race.png
CircuitImage = bg_circuit_race.png

## RGB tint multiplier on the Single Event overlay (0-1). Lower = dimmer, less bloom, more readable UI. 1 = full brightness (blooms hard).
# Setting type: Single
# Default value: 0.45
SingleEventBrightness = 0.45

## RGB tint multiplier on the Circuit overlay (0-1). Lower = dimmer, less bloom, more readable UI. 1 = full brightness (blooms hard).
# Setting type: Single
# Default value: 0.33
CircuitBrightness = 0.33

## PNG (1024x1024, 1:1, TRANSPARENT CENTER) drawn ABOVE the art on BOTH custom walls as an SSX-style metal bezel. Relative paths resolve next to this plugin DLL. Blank to leave the walls frameless.
# Setting type: String
# Default value: frame.png
FrameImage = frame.png

## RGB tint multiplier on the frame overlay (0-1). Higher than the art brightness so the chrome reads as metal; drop it if the bezel blooms/washes over the UI text.
# Setting type: Single
# Default value: 0.8
FrameBrightness = 0.8

## Raise the repurposed button's subtext (e.g. 'RANDOM 4-COURSE CIRCUIT') UP the wall by this fraction of the wall's height, to clear the frame's bottom bezel. Scale-independent; 0 = leave it where the game puts it. Tune per your frame's bottom-bar thickness.
# Setting type: Single
# Default value: 0.05
SubTextRaiseFrac = 0.05

Brightness = 0.5

[Circuit]

## Number of back-to-back races in one circuit (Mode=random only; the other modes race the whole pool).
# Setting type: Int32
# Default value: 4
RacesPerCircuit = 6

## 'random' draws RacesPerCircuit courses by EraMix. 'inorder' races EVERY course in the enabled games, in menu order, one game after another. 'shuffled' races every course in the enabled games, shuffled.
# Setting type: String
# Default value: random
Mode = shuffled

## GameObject name OR visible wall text of the main-menu button to repurpose. Campaign (wall='Left') and Multiplayer (wall='Right') are BOTH real dead buttons; CircuitMod targets Campaign so a sibling mod (CouchCoop) can use Multiplayer. Single Event is the live Race. The wire-up logs the full button inventory on first menu load so you can retarget this.
# Setting type: String
# Default value: Campaign
ButtonTargetName = Campaign

## Title shown on the repurposed button's wall.
# Setting type: String
# Default value: CIRCUIT
ButtonLabel = CIRCUIT

## Subtext shown under the title (replaces the wall's 'COMING SOON').
# Setting type: String
# Default value: BUILD YOUR OWN CIRCUIT
ButtonSubText = BUILD YOUR OWN CIRCUIT

## Title shown on the final standings screen (overrides the last track's name).
# Setting type: String
# Default value: Circuit
ResultsTitle = Circuit

## Comma-separated name/scene substrings to keep OUT of the pool (case-insensitive). Ignored if excluding would empty the pool.
# Setting type: String
# Default value: pipedream
ExcludeTracks = pipedream, Junction, Tricky, Tokyo, Perpendiculous, Schizophrenia, Launch

## Which eras of track the circuit may draw from, comma-separated. Known values: 'builtin' (the base game's own tracks; 'tricky_madness' also accepted), 'ssx_tricky' (SSX Tricky ports + community maps), 'ssx3' (SSX 3 peaks + the whole-mountain chain — OFF by default; the chain is a 7.5 km descent, far longer than one normal heat), 'ssx2012' (the SSX 2012 race courses), 'sledstorm' (Sled Storm (PS1) worlds — these are snowmobile CIRCUITS, so a race starts and finishes in nearly the same place; OFF by default), 'blur' (SSX Blur (Wii) run worlds — OFF by default), 'ontour_ps2' (SSX On Tour (PS2 console) race regions, plus the Village hub free-ride map which has no finish line of its own — OFF by default), 'avalanche' (1080 Avalanche (GameCube) courses — OFF by default), 'other' (custom maps with no sidecar / an unrecognised source). A map's era comes from the 'source' line in its .aipaths.txt sidecar, and any slug found there is accepted here, so a new source game needs no update to this mod. Leaving this blank falls back to the built-in tracks so a typo can't produce an empty circuit. The in-game Circuit page edits this line.
# Setting type: String
# Default value: builtin, ssx_tricky, ssx2012
Sources = avalanche

## How a circuit's races are spread over the enabled eras. 'varied' (default) re-rolls the shape every run: sometimes one era for the whole circuit, sometimes an even split, sometimes a lopsided ratio like 3+1. 'even' always splits evenly (4 races over 3 eras = 2/1/1). 'single' always races one era, chosen fresh each run. 'random' ignores eras entirely and draws from one flat bag — note this is dominated by whichever era has the most tracks (with SSX 2012 enabled, about 3 in 4 races, and a third of circuits end up all-2012).
# Setting type: String
# Default value: varied
EraMix = varied

## With EraMix=varied, how often (0-1) a circuit is DELIBERATELY a single-era run. The rest of the time it's an even split or a random ratio, half and half. The random-ratio shape lands on one era by chance about a fifth of the time, so the real single-era rate runs a little above this number — 0.25 here measures out at ~1 circuit in 3. Which era it lands on follows EraPoolBias, and an era too small to deal more than one distinct playlist is skipped for this shape entirely.
# Setting type: Single
# Default value: 0.25
SingleEraChance = 0.25

## How much an era's SIZE counts when the circuit decides which era a race comes from. 0 = every era equally likely no matter how few tracks it holds. 1 = strictly proportional to track count, which is what one flat bag does and is why SSX 2012 would then take about 3 in 4 races. The default 0.5 is the square root: the 48-track SSX 2012 era pulls about 3.5x as hard as the 4 built-ins instead of 12x (bias 1) or the same as them (bias 0). Raise it toward 1 to see the built-in four less often, lower it toward 0 to see them more.
# Setting type: Single
# Default value: 0.5
EraPoolBias = 0.5

## Mirror the track left-to-right for some or all of a circuit's races (camera flip + steering flip, so it still controls the way it looks). 'off' (default) never mirrors. 'on' mirrors every race. 'mix' alternates every other race. Applies to every circuit mode, and is always turned back off the instant you leave a circuit (quit or finish) so it can never carry into a normal race or the menu.
# Setting type: String
# Default value: off
MirrorMode = off

[Debug]

## Extra logging.
# Setting type: Boolean
# Default value: false
Verbose = false

