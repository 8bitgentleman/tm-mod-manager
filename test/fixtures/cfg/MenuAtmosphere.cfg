## Settings file was created by plugin Menu Atmosphere Mod v1.0.0
## Plugin GUID: MenuAtmosphere

[Atmosphere]

## Master switch for the main-menu weather (snow, mist, drifts, damaged lights).
# Setting type: Boolean
# Default value: true
Enabled = true

## Wind-blown snow drifting through the menu room.
# Setting type: Boolean
# Default value: true
Snow = true

## Multiplier on snowfall density (0-3). Lower it if flakes get in the way of the wall titles.
# Setting type: Single
# Default value: 1
SnowAmount = 1

## Thin ground fog creeping over the floor.
# Setting type: Boolean
# Default value: true
Mist = true

## Snow piles banked against the panel feet and corners.
# Setting type: Boolean
# Default value: true
Drifts = true

## Floor finish layered over the glossy floor: Mixed (wind-blown snow over cracked ice), Ice (cracked, frosted black ice), Off.
# Setting type: String
# Default value: Mixed
Floor = Mixed

## A course flag planted in the far-left snow heap, flapping in the same wind as the snow. Needs flag_alps.png next to the DLL.
# Setting type: Boolean
# Default value: true
Flag = true

## Which of the Alps flag designs: Black, White, Yellow, Blue, Red.
# Setting type: String
# Default value: Red
FlagDesign = Red

## The room's glow and cyan fill lights sag every few seconds, like failing power.
# Setting type: Boolean
# Default value: true
Brownout = true

## Floor light bars that are dead (comma list, 0-14, numbered left to right). Blank = none.
# Setting type: String
# Default value: 3,13
DeadBars = 3,13

## Floor light bars that flicker on their own (comma list, 0-14, left to right). Blank = none.
# Setting type: String
# Default value: 8
FlickerBars = 8

[Debug]

## Save atmosphere_shot.png next to the plugin DLL 6 s after the menu atmosphere installs.
# Setting type: Boolean
# Default value: false
AtmosphereShot = false

